# Spec §17: a `v*` tag builds the signed release APK and attaches it, with its checksum, to a GitHub Release.
# Needs four repository secrets: MISE_KEYSTORE_BASE64, MISE_KEYSTORE_PASSWORD, MISE_KEY_ALIAS, MISE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # versionName and versionCode come from the tag (git describe).
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate data/
        run: python3 tools/validate_data.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore the release keystore
        env:
          MISE_KEYSTORE_BASE64: ${{ secrets.MISE_KEYSTORE_BASE64 }}
          MISE_KEYSTORE_PASSWORD: ${{ secrets.MISE_KEYSTORE_PASSWORD }}
          MISE_KEY_ALIAS: ${{ secrets.MISE_KEY_ALIAS }}
          MISE_KEY_PASSWORD: ${{ secrets.MISE_KEY_PASSWORD }}
        run: |
          for name in MISE_KEYSTORE_BASE64 MISE_KEYSTORE_PASSWORD MISE_KEY_ALIAS MISE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Repository secret $name is not set"; exit 1; fi
          done
          echo "$MISE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Lint, ktlint, unit tests, signed release APK
        env:
          MISE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MISE_KEYSTORE_PASSWORD: ${{ secrets.MISE_KEYSTORE_PASSWORD }}
          MISE_KEY_ALIAS: ${{ secrets.MISE_KEY_ALIAS }}
          MISE_KEY_PASSWORD: ${{ secrets.MISE_KEY_PASSWORD }}
        run: ./gradlew lint ktlintCheck testDebugUnitTest :lint-checks:test assembleRelease

      - name: Verify the signature and write the checksum
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk="mise-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "mise-${GITHUB_REF_NAME}.apk" "mise-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Mise ${GITHUB_REF_NAME}" --generate-notes --verify-tag $prerelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
