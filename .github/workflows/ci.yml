# Spec §16–17: validate data → lint, ktlint, unit tests, debug APK. Must stay green on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate data/
        run: python3 tools/validate_data.py

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, ktlint, unit tests, debug APK
        run: ./gradlew lint ktlintCheck testDebugUnitTest :lint-checks:test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mise-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            lint-checks/build/reports/
